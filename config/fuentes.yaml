# Fuentes del Radar Farma & Seguros RD.
#
# Cada fuente tiene:
#   id:        identificador corto y único (sin espacios). Se usa en los datos y en el panel de estado.
#   nombre:    nombre del medio u organismo tal como se muestra en la página.
#   tipo:      rss | sitemap_noticias | html_documentos
#              - rss:               feed RSS o Atom.
#              - sitemap_noticias:  sitemap de Google News (trae título, fecha y enlace).
#              - html_documentos:   página HTML con enlaces a documentos (PDF). Se guarda
#                                   el título del enlace y el enlace; la fecha es la de detección.
#   url:       dirección a leer.
#   categoria: medio | organismo
#              - medio:      solo se guardan las noticias que coinciden con las palabras clave
#                            de algún sector (ver clasificacion.yaml).
#              - organismo:  se guarda todo lo que publica, con el sector "Regulación y gobierno".
#   activa:    true | false. Para desactivar una fuente sin borrarla.
#
# Opcionales:
#   tema_fijo:     tema que se asigna a todo lo que venga de esta fuente (si no se detecta otro).
#   patron_enlace: (html_documentos) expresión regular que deben cumplir los enlaces.
#   patron_titulo: (html_documentos) expresión regular que debe cumplir el título (opcional).
#   nota:          comentario libre.
#
# Verificación del 23 de octubre de 2026: robots.txt y términos revisados para cada sitio.
# Google Noticias quedó fuera porque su robots.txt no permite la ruta /rss a procesos automáticos.
# El Ministerio de Salud (msp.gob.do) no respondía; se puede volver a intentar más adelante.

fuentes:

  # ---------------- Medios ----------------

  - id: diariolibre_portada
    nombre: Diario Libre
    tipo: rss
    url: https://www.diariolibre.com/rss/portada.xml
