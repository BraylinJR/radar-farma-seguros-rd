# Reglas de clasificación por palabras clave.
#
# Cómo se comparan las palabras:
#   - Sin distinguir mayúsculas ni acentos (p. ej. "farmacéutica" = "FARMACEUTICA").
#   - Se buscan palabras completas: "ARS" no coincide con "ARSENAL".
#   - Un asterisco al final admite cualquier terminación: "farmac*" coincide con
#     "farmacia", "farmacias", "farmacéutico", "farmacéutica".
#   - Una frase con espacios se busca como frase: "registro sanitario".
#
# Sobre qué texto se aplican las reglas:
#   - Título de la noticia y las etiquetas o categorías que trae la fuente.
#   - En el momento de la captura, el resumen que trae el feed sirve de apoyo para
#     decidir el sector, pero solo si contiene dos o más palabras clave distintas del
#     mismo sector. El resumen no se guarda.
#
# Las noticias de MEDIOS se guardan solo si coinciden con al menos un sector.
# Las publicaciones de ORGANISMOS se guardan siempre con el sector "Regulación y gobierno"
# (y además cualquier otro sector que se detecte).

