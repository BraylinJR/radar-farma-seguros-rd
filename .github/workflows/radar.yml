# Radar Farma & Seguros RD: recolecta, clasifica, guarda el historial y publica la página.
#
# Se ejecuta cada 6 horas, a mano desde la pestaña Actions ("Run workflow") y cuando se
# cambia la configuración o el código en la rama main.
#
# Requisito único en GitHub: Settings > Pages > Build and deployment > Source: "GitHub Actions".

name: Radar

on:
  schedule:
    - cron: "17 */6 * * *"   # 00:17, 06:17, 12:17 y 18:17 UTC (20:17, 02:17, 08:17 y 14:17 en RD)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "radar/**"
      - "docs/app.js"
      - "docs/estilos.css"
      - "requirements.txt"
      - ".github/workflows/radar.yml"

permissions:
  contents: write     # guardar datos/ en el repositorio
  issues: write       # avisar cuando una fuente falla 3 veces seguidas
  pages: write        # publicar en GitHub Pages
  id-token: write     # requerido por la publicación en Pages

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recolectar y clasificar
        # Una fuente que falla no detiene a las demás. Si fallan todas, el paso queda en
        # error pero el flujo sigue: guarda el estado, avisa y vuelve a publicar.
        continue-on-error: true
        run: python -m radar recolectar

      - name: Aplicar reglas y correcciones actuales al historial
        run: python -m radar reclasificar

      - name: Generar la página
        run: python -m radar generar

      - name: Guardar datos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/
          if git diff --cached --quiet; then
            echo "Sin cambios en datos/"
            exit 0
          fi
          git commit -m "Datos: corrida del $(TZ=America/Santo_Domingo date '+%Y-%m-%d %H:%M') (hora RD)"
          for intento in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Reintento ${intento} de la subida"
            sleep $((intento * 5))
          done
          exit 1

      - name: Avisos por fuentes con fallos repetidos
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m radar avisos

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Empaquetar la página
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  publicar:
    needs: recolectar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v5
